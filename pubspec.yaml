name: fashion_store
description: StyleHub Fashion Store - CIT211 Mobile Software Development Assignment
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.1.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  smooth_page_indicator: ^1.1.0

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true

  # --- FIXED ASSETS SECTION ---
  assets:
    - assets/images/bg/
    - assets/images/slider/
    - assets/images/women/
    - assets/images/men/
    - assets/images/kids/
    - assets/images/accessories/